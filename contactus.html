<style data-purpose="custom-styles">body {

h1, h2, h3, h4, h5, h6 {

.page-rise {

    transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1)
    }
.page-rise.is-visible {
    opacity: 1;
    transform: translateY(0)

@media (prefers-reduced-motion: reduce) {
    .page-rise {
        opacity: 1;
        transform: none;
        transition: none
        }
    }</style>

<main class="min-h-[50vh] bg-white">
<section class="bg-white py-12 md:py-16 lg:py-20">
<div class="page-rise max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
<h1 class="text-4xl md:text-5xl font-bold text-black font-heading mb-4">Contact us</h1>
<p class="text-base md:text-lg text-black mb-10 md:mb-12 max-w-2xl"> Use the form below to get in touch.</p>
<form action="#" class="space-y-6 md:space-y-8" method="post">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 md:gap-8">
<div>
<label class="block text-sm font-medium text-black mb-2" for="contact-name">Name</label>
<input class="block w-full rounded-sm border border-neutral-300 bg-white px-4 py-3 text-black shadow-sm transition-colors focus:border-rf-navy focus:outline-none focus:ring-2 focus:ring-rf-navy/20" id="contact-name" name="name" required="" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-black mb-2" for="contact-phone">Phone Number</label>
<input class="block w-full rounded-sm border border-neutral-300 bg-white px-4 py-3 text-black shadow-sm transition-colors focus:border-rf-navy focus:outline-none focus:ring-2 focus:ring-rf-navy/20" id="contact-phone" name="phone" type="tel"/>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 md:gap-8">
<div>
<label class="block text-sm font-medium text-black mb-2" for="contact-email">Email</label>
<input class="block w-full rounded-sm border border-neutral-300 bg-white px-4 py-3 text-black shadow-sm transition-colors focus:border-rf-navy focus:outline-none focus:ring-2 focus:ring-rf-navy/20" id="contact-email" name="email" required="" type="email"/>
</div>
<div>
<label class="block text-sm font-medium text-black mb-2" for="contact-subject">Subject</label>
<input class="block w-full rounded-sm border border-neutral-300 bg-white px-4 py-3 text-black shadow-sm transition-colors focus:border-rf-navy focus:outline-none focus:ring-2 focus:ring-rf-navy/20" id="contact-subject" name="subject" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-black mb-2" for="contact-message">Message</label>
<textarea class="block w-full min-h-[180px] md:min-h-[220px] resize-y rounded-sm border border-neutral-300 bg-white px-4 py-3 text-black shadow-sm transition-colors focus:border-rf-navy focus:outline-none focus:ring-2 focus:ring-rf-navy/20" id="contact-message" name="message" required="" rows="6"></textarea>
</div>
<div class="flex justify-end pt-2">
<button class="inline-flex items-center justify-center rounded-sm bg-rf-navy px-10 py-3.5 text-sm font-semibold uppercase tracking-wide text-white transition-colors hover:bg-rf-blue focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rf-navy" type="submit">Submit</button>
</div>
</form>
<p class="mt-8 text-sm text-rf-gray">
          Or email us directly at
          <a class="text-rf-navy font-medium hover:text-rf-teal transition-colors" href="mailto:rfusiontechnologies@gmail.com">rfusiontechnologies@gmail.com</a>
</p>

<div class="flex items-center space-x-6 text-sm text-rf-gray">

          rfusiontechnologies@gmail.com

<a class="flex items-center hover:text-rf-navy transition-colors" href="https://www.linkedin.com/company/rfusiontech/" target="_blank" rel="noopener noreferrer">

<script>
(function () {
  var content = document.querySelector(".page-rise");
  if (!content) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    content.classList.add("is-visible");
    return;
  }
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      content.classList.add("is-visible");
    });
  });
})();
</script>
